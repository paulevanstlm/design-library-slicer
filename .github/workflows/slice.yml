name: Slice screenshots

# Cuts full-page screenshots into modules for the Toro design library. The library's Worker triggers this with
# repository_dispatch as soon as captures land; the hourly schedule is a safety net.
# Public repo so Actions minutes are free. Code only: no keys, images or data live here.
on:
  repository_dispatch:
    types: [slice]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: slice
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python slice.py
        env:
          WORKER_URL: ${{ vars.WORKER_URL || 'https://design-library.paul-evans.workers.dev' }}
          PIPELINE_SHARED_SECRET: ${{ secrets.PIPELINE_SHARED_SECRET }}
