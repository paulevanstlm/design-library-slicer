name: Slice screenshots

# Cuts full-page screenshots into modules for the Toro design library. Runs every 10 minutes: when there's no work it
# finishes in seconds; when there is, it keeps slicing until the queue is empty (up to 25 minutes a run).
# Public repo so Actions minutes are free. Code only: no keys, images or data live here.
on:
  schedule:
    - cron: "*/10 * * * *"
    # Monthly keep-alive: GitHub pauses scheduled workflows in a repo with no commits for 60 days.
    - cron: "0 3 1 * *"
  workflow_dispatch:

concurrency:
  group: slice
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  slice:
    if: github.event.schedule != '0 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python slice.py
        env:
          WORKER_URL: ${{ vars.WORKER_URL || 'https://design-library.paul-evans.workers.dev' }}
          PIPELINE_SHARED_SECRET: ${{ secrets.PIPELINE_SHARED_SECRET }}

  keepalive:
    if: github.event.schedule == '0 3 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep-alive: stops GitHub pausing the schedule after 60 quiet days"
          git push
